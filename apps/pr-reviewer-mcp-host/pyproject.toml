[project]
name = "pr-reviewer-mcp-host"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaina Batool", email = "b.aaina@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "mcp>=2.0.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
pr-reviewer-mcp-host = "pr_reviewer_mcp_host:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
